<main class="wrap">

  <section class="page-head">
    <h1 class="page-title" data-i18n="contact.title">Contacto</h1>
    <p class="page-intro" data-i18n="contact.intro">Contame de tu proyecto — cinematografía, edición o color. Te respondo por mail.</p>
  </section>

  <section class="sec">
    <div class="contact-grid about-panel">

      <form class="contact-form" id="contactForm" name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contacto">
        <p class="hp-field" aria-hidden="true">
          <label>No llenar <input name="bot-field" tabindex="-1" autocomplete="off"></label>
        </p>

        <div class="form-field">
          <label for="cf-nombre" data-i18n="contact.nombre">Nombre</label>
          <input id="cf-nombre" name="nombre" type="text" required autocomplete="name">
        </div>

        <div class="form-field">
          <label for="cf-email" data-i18n="contact.email">Email</label>
          <input id="cf-email" name="email" type="email" required autocomplete="email">
        </div>

        <div class="form-field">
          <label for="cf-tipo" data-i18n="contact.tipo">Tipo de proyecto</label>
          <select id="cf-tipo" name="tipo">
            <option value="cinematografia" data-i18n="contact.tipo.cine">Cinematografía / fotografía</option>
            <option value="edicion" data-i18n="contact.tipo.edicion">Edición</option>
            <option value="color" data-i18n="contact.tipo.color">Color</option>
            <option value="otro" data-i18n="contact.tipo.otro">Otro</option>
          </select>
        </div>

        <div class="form-field">
          <label for="cf-mensaje" data-i18n="contact.mensaje">Contame de tu proyecto</label>
          <textarea id="cf-mensaje" name="mensaje" required></textarea>
        </div>

        <button type="submit" class="form-submit">
          <span data-i18n="contact.enviar">Enviar</span>
          <span aria-hidden="true">→</span>
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <div class="contact-alt">
        <h2 class="sec-title" data-i18n="contact.directo">Escribime directo</h2>
        <a class="contact-mail" href="mailto:jgutimoyan@gmail.com">jgutimoyan@gmail.com</a>
        <a class="contact-mail" href="mailto:the.slyfox.project@gmail.com">the.slyfox.project@gmail.com</a>
        <a class="contact-mail" href="https://www.imdb.com/es-es/name/nm10852021/" target="_blank" rel="noopener">IMDb ↗</a>
      </div>

    </div>
  </section>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script>
/* Envío por AJAX a Netlify (si el sitio ya está desplegado ahí);
   si falla (todavía local, o Netlify Forms sin activar) cae a un
   mailto: con lo que la persona ya escribió, para no perder el mensaje. */
(function () {
  var form = document.getElementById('contactForm');
  var status = document.getElementById('formStatus');
  if (!form) return;

  function encode(data) {
    return Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = Object.fromEntries(new FormData(form).entries());

    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: encode(data)
    }).then(function (r) {
      if (!r.ok) throw new Error('sin Netlify Forms');
      status.textContent = window.i18n.t('contact.ok');
      form.reset();
    }).catch(function () {
      var subject = 'Proyecto — ' + (data.tipo || '');
      var body = 'Nombre: ' + data.nombre + '\nEmail: ' + data.email + '\n\n' + data.mensaje;
      location.href = 'mailto:jgutimoyan@gmail.com,the.slyfox.project@gmail.com' +
        '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    });
  });
})();
</script>
